<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171410">
    <title>Granja Dashboard · Ingreso</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🌾</text></svg>">
    <link rel="stylesheet" href="/static/css/style.css?v=36" />
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card slide-up">
            <div class="login-logo">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#84cc16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 22c1.5-4 4-6 10-6s8.5 2 10 6"/>
                    <path d="M12 16V8"/>
                    <path d="M12 8c0-3-2-4-4-4S4 5 4 8"/>
                    <path d="M12 8c0-3 2-4 4-4s4 1 4 4"/>
                </svg>
            </div>
            <h2>Granja Dashboard</h2>
            <p class="login-desc">Monitoreo IoT de cultivos con Thread</p>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Usuario ThingsBoard" required autocomplete="username" />
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
                </div>
                <p id="login-error" class="login-error"></p>
                <button type="submit" class="btn-primary" id="login-btn">Ingresar al sistema</button>
            </form>
            <p class="login-footer">Sistema de monitoreo agrícola · IoT Thread</p>
        </div>
    </div>
    <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("login-btn");
        const errorEl = document.getElementById("login-error");
        errorEl.textContent = "";
        btn.disabled = true;
        btn.textContent = "Conectando...";

        try {
            const res = await fetch("/api/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });
            if (res.ok) {
                const data = await res.json();
                sessionStorage.setItem("username", data.username || "Usuario");
                window.location.href = "/dashboard";
            } else {
                const data = await res.json();
                errorEl.textContent = data.detail || "Credenciales inválidas";
                btn.disabled = false;
                btn.textContent = "Ingresar al sistema";
            }
        } catch (err) {
            errorEl.textContent = "Error de conexión. Verifica tu red.";
            btn.disabled = false;
            btn.textContent = "Ingresar al sistema";
        }
    });
    </script>
</body>
</html>
