services:
  # ── OpenThread Border Router ──────────────────────────────────
  otbr:
    image: openthread/border-router:latest
    container_name: otbr
    network_mode: host
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /var/lib/otbr:/data
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=1000000&skip-rcp-compatibility-check"
      OT_INFRA_IF: "wlan0"              # <-- cambiar según interfaz del embebido
      OT_THREAD_IF: "wpan0"
      OT_LOG_LEVEL: "7"
      OT_WEB_LISTEN_ADDR: "0.0.0.0"
      OT_WEB_LISTEN_PORT: 8083
      OT_REST_LISTEN_ADDR: "0.0.0.0"
      OT_REST_LISTEN_PORT: 8081

  # ── ThingsBoard Edge ──────────────────────────────────────────
  mytbedge:
    restart: always
    image: "thingsboard/tb-edge:4.2.0EDGE"
    ports:
      - "8082:8080"     # Web UI
      - "1884:1883"     # MQTT (para el bridge)
      - "5684:5683/udp" # CoAP
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tb-edge
      CLOUD_ROUTING_KEY: 549031e7-e5e1-45b0-5e95-47423d778f50
      CLOUD_ROUTING_SECRET: c0l34b2p3faqzlaj17cl
      CLOUD_RPC_HOST: "IP_DEL_SERVIDOR_PRINCIPAL"   # <-- cambiar IP del ThingsBoard CE
      CLOUD_RPC_PORT: 7070
      CLOUD_RPC_SSL_ENABLED: false
    volumes:
      - tb-edge-data:/data
      - tb-edge-logs:/var/log/tb-edge
    depends_on:
      - postgres

  # ── PostgreSQL (para TB Edge) ─────────────────────────────────
  postgres:
    restart: always
    image: "postgres:16"
    environment:
      POSTGRES_DB: tb-edge
      POSTGRES_PASSWORD: postgres
    volumes:
      - tb-edge-postgres-data:/var/lib/postgresql/data

  # ── Bridge Python (CoAP → MQTT) ──────────────────────────────
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: iot-bridge
    network_mode: host
    restart: unless-stopped
    environment:
      START_SIMULATION: "true"    # false para producción real
    depends_on:
      - mytbedge

volumes:
  tb-edge-data:
  tb-edge-logs:
  tb-edge-postgres-data:
